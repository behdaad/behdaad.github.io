<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Ratings · Behdad Keynejad</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="app.js?v=3" defer></script>
</head>
<body id="top">
    <header class="masthead wrap">
        <a class="wordmark" href="#top">
            <span class="record-mark" aria-hidden="true"></span>
            Music Ratings
        </a>
        <nav aria-label="Main">
            <a href="#albums">Albums <span aria-hidden="true">↓</span></a>
            <a href="../">Behdad <span aria-hidden="true">↗</span></a>
        </nav>
        <div class="theme-control">
            <label for="theme">Theme</label>
            <select id="theme" disabled>
                <option value="slate">Slate (light)</option>
                <option value="midnight">Midnight (dark)</option>
            </select>
        </div>
    </header>
    <main class="wrap">
        <header class="hero">
            <h1>Music <em>Ratings</em></h1>
            <p>My personal album ratings, updated daily.</p>
        </header>
        <div class="controls" id="albums">
            <label for="search">Search albums or artists
                <input id="search" type="search" placeholder="Search" disabled>
            </label>
            <label for="sort">Sort by
                <select id="sort" disabled>
                    <option value="">Workbook order</option>
                    <option value="artist">Artist</option>
                    <option value="album">Album</option>
                    <option value="year">Release year, newest first</option>
                    <option value="rating">Rating, highest first</option>
                </select>
            </label>
        </div>
        <p id="status" role="status">Loading albums…</p>
        <noscript>Enable JavaScript to view the album ratings.</noscript>
        <table hidden>
            <thead>
                <tr>
                    <th scope="col">Artist</th>
                    <th scope="col">Album</th>
                    <th scope="col">Year</th>
                    <th scope="col">Rating</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
</body>
</html>
