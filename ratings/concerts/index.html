<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concert Ratings · Behdad Keynejad</title>
    <link rel="icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="/ratings/style.css?v=7">
    <script src="/ratings/app.js?v=8" defer></script>
</head>
<body>
    <header class="masthead wrap">
        <a class="wordmark" href="/ratings/">Ratings</a>
        <nav aria-label="Main">
            <a href="/ratings/music/">Music</a>
            <a href="/ratings/concerts/" aria-current="page">Concerts</a>
            <a href="/">Behdad <span aria-hidden="true">↗</span></a>
        </nav>
        <div class="theme-control">
            <label for="theme">Theme</label>
            <select id="theme" disabled>
                <option value="slate">Slate (light)</option>
                <option value="midnight">Midnight (dark)</option>
            </select>
        </div>
    </header>
    <main class="wrap">
        <header class="hero">
            <h1>Concert <em>Ratings</em></h1>
            <p>My ratings for live performances I’ve attended.</p>
        </header>
        <section data-ratings="concerts.json" data-singular="performance" data-plural="performances">
            <div class="controls" id="performances">
                <label for="search">Search performers, cities, or venues
                    <input id="search" type="search" placeholder="Search" disabled>
                </label>
            </div>
            <p id="status" role="status">Loading performances…</p>
            <noscript>Enable JavaScript to view the ratings.</noscript>
            <div class="table-scroll" role="region" aria-label="Concert Ratings table" tabindex="0" hidden>
                <table>
                    <thead>
                        <tr>
                            <th scope="col"><button type="button" data-sort="artist" data-searchable>Performer <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="descending"><button type="button" data-sort="date" data-direction="descending">Date <span aria-hidden="true"></span></button></th>
                            <th scope="col"><button type="button" data-sort="city" data-searchable>City <span aria-hidden="true"></span></button></th>
                            <th scope="col"><button type="button" data-sort="venue" data-searchable>Venue <span aria-hidden="true"></span></button></th>
                            <th scope="col" class="compact"><button type="button" data-sort="rating" data-direction="descending">Rating <span aria-hidden="true"></span></button></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
